name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          VERSION=$(curl -sSfL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep '"tag_name"' | cut -d\" -f4)
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_${OS}_${ARCH}.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Secret scan — gitleaks
        run: |
          gitleaks detect --no-banner --verbose 2>&1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest mypy
          pip install -r skills/specback/scripts/requirements.txt 2>&1 | tail -3

      - name: Verify git hooks are valid (syntax check)
        run: |
          bash -n .githooks/pre-commit
          bash -n .githooks/pre-push
          echo "  ✅ Git hook syntax valid"

      - name: Run tests — scripts/
        run: |
          python -m pytest skills/specback/scripts/tests/ -v --tb=short

      - name: Run tests — source_map_v2/
        run: |
          python -m pytest skills/specback/scripts/source_map_v2/tests/ -v --tb=short

      - name: Type check — mypy (advisory)
        run: |
          python -m mypy skills/specback/scripts/ \
            --ignore-missing-imports \
            --follow-imports=skip 2>&1 \
            || echo "  ⚠️  mypy reported warnings (non-blocking)"

      - name: Smoke import — source_map_v2 module
        run: |
          cd skills/specback/scripts
          python -c "
          import sys
          sys.path.insert(0, '.')
          from source_map_v2 import SCHEMA_VERSION, build_source_map
          from source_map_v2.taxonomy import ROLES, UNIVERSAL_TABLES
          print(f'  ✅ source_map_v2 (schema {SCHEMA_VERSION}, {len(ROLES)} roles)')
          "

      - name: Smoke import — standalone scripts via pytest collect
        run: |
          python -m pytest skills/specback/scripts/tests/ \
            --collect-only -q 2>&1 | tail -5
          echo "  ✅ All test imports resolved"
