# specback ADW configuration — Agent Roster
#
# The Agent Roster assigns different models to different phases based on
# their capabilities and cost requirements. Each phase maps to an agent
# name in the `roster` section; the agent definition determines which
# model/provider/CLI backend is used.
#
# ## Cost optimization strategy
#
# | Phase           | Required capability          | Recommended model     | Relative cost |
# |-----------------|------------------------------|----------------------|---------------|
# | Setup           | Goal definition (cheap)      | Flash-class          | 💰 Low        |
# | Recon           | File scan + summary (cheap)  | Flash-class          | 💰 Low        |
# | WBS             | Structuring + classification | Flash-class          | 💰 Low        |
# | Investigate     | Deep code understanding      | Reasoning-class      | 💰💰 Medium   |
# | Verify          | Code phase (no LLM needed)   | —                    | $0            |
# | Refine/Dialogue | User interaction + reasoning | High-reasoning-class | 💰💰💰 High  |
# | Deliver         | Aggregation (cheap)          | Flash-class          | 💰 Low        |
# | Drift           | Diff analysis (medium)       | Flash-class          | 💰 Low        |
# | Changespec      | Change narration (medium)    | Flash-class          | 💰 Low        |
#
# ## CLI backend resolution order
#   1. Per-agent `cli` field below
#   2. `defaults.cli`
#   3. ADW_CLI environment variable (e.g. `export ADW_CLI=claude-code`)
#   4. Hard default: opencode
#
# ## Model resolution order
#   1. Per-agent `model` field
#   2. `defaults.model`
#   3. ADW_MODEL environment variable
#   4. Hard default: ds-v4-flash
#
# Supported backends: copilot, opencode, claude-code, codex, pi

# ── Global defaults ─────────────────────────────────────────────────────
# All agents inherit these unless overridden.
defaults:
  provider: opencode-zen
  model: ds-v4-flash
  cli: opencode

# ── Phase → Agent roster ────────────────────────────────────────────────
# Maps each ADW phase to a named agent. The agent definition (in `agents:`)
# provides model/provider/cli overrides. Phases not listed here fall back
# to an agent with the same name as the phase, or to `defaults`.
roster:
  setup: engineer
  recon: scout
  wbs: engineer
  investigate: investigator
  verify: engineer
  refine: engineer
  deliver: engineer
  drift: engineer
  changespec: changespec

# ── Agent definitions ──────────────────────────────────────────────────
# Each agent defines model, provider, CLI backend, and system prompt.
# Omitted fields inherit from `defaults`.
agents:
  engineer:
    provider: opencode-zen
    model: ds-v4-flash
    cli: opencode
    system_prompt: >
      You are a software specification engineer.
      Ask targeted questions to define the specification goal.
  scout:
    provider: opencode-zen
    model: ds-v4-flash
    cli: opencode
    system_prompt: >
      You are a codebase scout. Perform shallow reconnaissance
      of the target codebase to understand its structure and key components.
  investigator:
    provider: opencode-zen
    model: ds-v4-flash
    cli: opencode
    system_prompt: >
      You are a specification investigator. Research specific chapters
      of a specification document by analyzing the codebase.
  changespec:
    provider: opencode-zen
    model: ds-v4-flash
    cli: opencode
    system_prompt: >
      You are a change specification writer. Explain code changes
      in natural language for the reader's understanding.

  # ── Example optimized roster (comment these in to activate) ──────────
  # To use different models per phase, replace the agent model fields above
  # or define new agents in the roster. Example:
  #
  # roster:
  #   setup: engineer
  #   recon: recon-agent        # custom lightweight agent
  #   wbs: engineer
  #   investigate: deep-investigator  # heavy reasoning model
  #   verify: engineer
  #   refine: dialogue-agent    # interactive reasoning model
  #   deliver: engineer
  #   drift: engineer
  #   changespec: changespec
  #
  # agents:
  #   recon-agent:
  #     provider: opencode-zen
  #     model: google/gemini-3.6-flash    # cheap & fast
  #     cli: opencode
  #   deep-investigator:
  #     provider: fireworks
  #     model: fireworks/accounts/fireworks/models/kimi-k3  # deep reasoning
  #     cli: opencode
  #   dialogue-agent:
  #     provider: openai
  #     model: openai/gpt-5.6-terra       # high-reasoning for user dialogue
  #     cli: opencode

  # ── Alternate backend agents ─────────────────────────────────────────
  # Copilot backend (uses gh copilot suggest)
  copilot-agent:
    provider: github-copilot
    model: gpt-4o
    cli: copilot
    system_prompt: ""

  # Pi backend (uses pi CLI)
  pi-agent:
    provider: pi
    model: pi-model
    cli: pi
    system_prompt: ""
