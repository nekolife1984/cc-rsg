# gitleaks configuration for specback
# This file is checked into the repository.

[allowlist]
  description = "specback-specific allowlist"

  # Test fixtures may contain simulated secrets
  paths = [
    "(.*/)?tests/.*",
    "(.*/)?test_.*",
    "(.*/)?fixtures/.*",
  ]

  # CHANGELOG and LICENSE files reference URLs with tokens
  files = [
    "(CHANGELOG|LICENSE).*",
  ]

  # Allow GitHub URL references in markdown
  regexes = [
    "(?i)github\\.com/nekolife1984/specback",
  ]
